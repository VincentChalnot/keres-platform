# see https://symfony.com/doc/current/reference/configuration/framework.html
parameters:
    # Default to empty string = trust no proxy (safe for dev where Caddy is the edge).
    # Prod sets TRUSTED_PROXIES to the docker network CIDR Traefik uses to reach us.
    env(TRUSTED_PROXIES): ''
    # Prod keeps the default. Any environment whose SESSION_COOKIE_DOMAIN is a
    # subdomain of another one's (dev: local.playkeres.com under prod:
    # playkeres.com) MUST set a different name - see the session block below.
    env(SESSION_COOKIE_NAME): KERESSESSID

framework:
    secret: '%env(APP_SECRET)%'

    # Trust X-Forwarded-* headers from these IPs/ranges so Request::getClientIp()
    # returns the real client instead of the reverse proxy.  Comma-separated.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'

    # Note that the session will be started ONLY if you read or write from it.
    # cookie_domain scopes the session cookie to the parent domain (e.g.
    # local.playkeres.com / playkeres.com) instead of just the app subdomain.
    # This is required for Symfony's HttpUtils domain-regexp redirect guard to
    # allow the logout target (STATIC_SITE_URL) to point at a sibling
    # subdomain — without it, every cross-subdomain redirect target silently
    # collapses to "/" (see Symfony\Bundle\SecurityBundle\DependencyInjection\
    # Compiler\AddSessionDomainConstraintPass).
    #
    # `name` is deliberately *not* the PHP default (PHPSESSID): before
    # cookie_domain was introduced the session cookie was host-scoped to
    # app.<domain>, so any browser that used the app before that change ends up
    # holding two same-named session cookies (app.<domain> + .<domain>). Both
    # are sent on every request, oldest first, and PHP keeps the first
    # occurrence — so the stale host-scoped one permanently shadows the real
    # session: login succeeds and writes the token to the domain-scoped
    # session, then the next request reads the stale empty one and bounces
    # back to /login. A distinct name makes those leftovers inert.
    #
    # The same collision happens across *different* domains for any two
    # deployments where one cookie domain is a parent of the other: prod
    # (Domain=playkeres.com) is also sent to dev (app.local.playkeres.com,
    # Domain=local.playkeres.com). The browser sends the older one first, PHP
    # keeps the first occurrence, so the prod ID shadows the dev session and a
    # successful login silently bounces back to /login until the cookie is
    # deleted. Hence a per-environment name (SESSION_COOKIE_NAME); the other
    # environment's cookie is then simply ignored.
    #
    # Sessions live in the `sessions` Postgres table (PdoSessionHandler, see
    # config/services.yaml), not in the container's filesystem, so logins
    # survive container restarts and redeployments. The cookie lasts 30 days
    # and is re-issued on every request that touches the session; the row's
    # sess_lifetime is pushed forward at the same time (sliding expiry), and
    # gc_maxlifetime is what PdoSessionHandler uses as the row TTL. Expired
    # rows are purged by PHP's probabilistic gc (1% of session starts).
    session:
        name: '%env(SESSION_COOKIE_NAME)%'
        cookie_domain: '%env(SESSION_COOKIE_DOMAIN)%'
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        cookie_lifetime: 2592000
        gc_maxlifetime: 2592000
        gc_probability: 1
        gc_divisor: 100

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
