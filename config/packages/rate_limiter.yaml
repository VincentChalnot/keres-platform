framework:
    rate_limiter:
        contact_limiter:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'

        # 04-matchmaking.md sec 6.1. No `_limiter` suffix -> the autowiring
        # alias is the readable $seekCreateLimiter/etc, no explicit bind needed
        # (config/services.yaml:34-39 documents the contact_limiter gotcha
        # this naming avoids).
        seek_create:                # $seekCreateLimiter, keyed on user id
            policy: 'token_bucket'
            limit: 10
            rate: { interval: '1 minute', amount: 6 }
        seek_accept:                # $seekAcceptLimiter, keyed on user id
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '1 minute', amount: 10 }
        seek_heartbeat:             # $seekHeartbeatLimiter, keyed on seek uuid
            policy: 'fixed_window'
            limit: 30
            interval: '1 minute'
        lobby_read:                 # $lobbyReadLimiter, keyed on client IP
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'

        # 09-api-reference.md sec 7. No `_limiter` suffix, same reasoning as
        # above (config/services.yaml:34-39).
        social_action:               # $socialActionLimiter, keyed on user id
            policy: 'sliding_window'
            limit: 60
            interval: '1 hour'
        friend_request:              # $friendRequestLimiter, keyed on user id
            policy: 'sliding_window'
            limit: 20
            interval: '1 day'
        friend_search:               # $friendSearchLimiter, keyed on user id
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'
        username_change:             # $usernameChangeLimiter, keyed on user id
            policy: 'sliding_window'
            limit: 3
            interval: '1 day'

        notification_read:           # $notificationReadLimiter, keyed on user id (09-api-reference.md sec 7)
            policy: 'fixed_window'
            limit: 120
            interval: '1 minute'
        # Every call to the AI backend (GCP Cloud Run, billed) is limited: per IP for guests, per user when signed in.
        # Hints (D16 of `DECISIONS.md`) draw from the same buckets as the AI's replies.
        guest_ai:                    # $guestAiLimiter, keyed on client IP - anonymous AI games and hints (casual, unlimited games only)
            policy: 'token_bucket'
            limit: 15
            rate: { interval: '1 minute', amount: 10 }
        user_ai:                     # $userAiLimiter, keyed on user id - AI replies in bot games (casual and rated) and hints; generous so a rated bullet game vs a bot stays playable
            policy: 'token_bucket'
            limit: 40
            rate: { interval: '1 minute', amount: 30 }
        guest_move_record:           # $guestMoveRecordLimiter, keyed on client IP - guest moves recorded into the analytics tree
            policy: 'token_bucket'
            limit: 60
            rate: { interval: '1 minute', amount: 60 }
        waitlist_signup:            # $waitlistSignupLimiter, keyed on client IP (T7)
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'
