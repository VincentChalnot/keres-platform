security:
    password_hashers:
        App\Entity\User: auto

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\MultiProviderOidcAuthenticator
                - App\Security\DevLoginAuthenticator
            form_login:
                login_path: login
                check_path: login_check
                enable_csrf: true
                default_target_path: dashboard
            entry_point: App\Security\MultiProviderOidcAuthenticator
            logout:
                path: logout
                target: '%env(STATIC_SITE_URL)%'

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: '^/play/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', roles: PUBLIC_ACCESS, methods: [GET] }
        # AI/hot-seat without an account (browser-only guest games).
        - { path: ^/play/(new|guest)$, roles: PUBLIC_ACCESS }
        - { path: ^/play, roles: ROLE_USER }
        - { path: ^/settings, roles: ROLE_USER }
        - { path: ^/notifications, roles: ROLE_USER }
        - { path: ^/feedback, roles: ROLE_USER }
        - { path: ^/preferences, roles: ROLE_USER }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/games, roles: ROLE_USER }
        # T11: ROLE_USER here is what makes the login-redirect-and-come-back
        # flow free - the `main` firewall's entry point already saves this
        # exact URL as target_path for an anonymous visitor and restores it
        # post-login (see InviteAcceptAction's docblock).
        - { path: ^/invite, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
