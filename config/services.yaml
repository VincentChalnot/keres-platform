# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mercure.default_cookie_lifetime: 43200

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $backendApiUrl: '%env(BACKEND_API_URL)%'
            $aiBackendApiUrl: '%env(AI_BACKEND_API_URL)%'
            int $cookieLifetime: '%mercure.default_cookie_lifetime%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Bound explicitly (not a global _defaults.bind) so only this dev-only
    # authenticator ever sees kernel.environment.
    App\Security\DevLoginAuthenticator:
        arguments:
            $environment: '%kernel.environment%'

    # Explicit bind: symfony/rate-limiter's autowiring alias name is
    # $contactLimiterLimiter (from the "contact_limiter" limiter name), which
    # doesn't match the more readable constructor argument name below.
    App\Action\Api\ContactAction:
        arguments:
            $contactLimiterFactory: '@limiter.contact_limiter'

    # sidus/datagrid-bundle's DataGridRegistry and sidus/filter-bundle's
    # QueryHandlerRegistry memoize built objects per-code and never rebuild
    # them, which leaks stale state across requests under this platform's
    # persistent FrankenPHP worker mode (see ResettableDataGridRegistry
    # docblock). Decorate them (not a same-ID class override — the bundles'
    # own Resources/config/services.yaml PSR-4-glob and unconditionally
    # re-register the vanilla class under that same ID during their own
    # extension load, which would silently clobber a same-ID override
    # depending on load order) with worker-safe wrappers that reset via
    # Symfony's kernel.reset mechanism.
    App\Service\Admin\ResettableDataGridRegistry:
        decorates: Sidus\DataGridBundle\Registry\DataGridRegistry
        arguments: ['@.inner']
        tags:
            - { name: 'kernel.reset', method: 'reset' }

    App\Service\Admin\ResettableQueryHandlerRegistry:
        decorates: Sidus\FilterBundle\Registry\QueryHandlerRegistry
        arguments: ['@.inner']
        tags:
            - { name: 'kernel.reset', method: 'reset' }

    # Mercure Authorization: not autowired by the Mercure bundle as a standalone
    # service. Register it here so MercureAuthorizationListener can inject it
    # to mint/clear the subscriber-JWT cookie.
    Symfony\Component\Mercure\Authorization:
        arguments:
            $hubUrl: '%env(MERCURE_PUBLIC_URL)%'
            $defaultLifetime: '%mercure.default_cookie_lifetime%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
