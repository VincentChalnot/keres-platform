sidus_admin:
    configurations:
        MailerError:
            entity: App\Entity\MailerError
            controller_pattern:
                - 'Sidus\AdminBundle\Action\{{Action}}Action'
            template_pattern:
                - 'admin/actions/{{action}}.{{format}}.twig'
                - '@SidusAdmin/Action/{{action}}.{{format}}.twig'
            prefix: /admin/mailer-errors
            actions:
                list:
                    path: /
            options:
                icon: envelope-circle-check
