[program:evaluation-consume]
command=php /app/bin/console messenger:consume evaluation --time-limit=60 --memory-limit=128M --quiet
user=root
numprocs=1
autostart=true
autorestart=true
startsecs=0
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
