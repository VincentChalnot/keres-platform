[program:deadline-sweep]
command=/bin/sh -c "while true; do php /app/bin/console app:games:sweep-deadlines --no-interaction; sleep 60; done"
user=root
numprocs=1
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
