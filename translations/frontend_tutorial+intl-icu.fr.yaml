# Tutoriel (assets/typescript/src/tutorial.ts) : les leçons de public/tutorial/lessons.json, dont les textes sont des clés de ce
# fichier (`tutorial.lessons.<id>.title|text`, étapes d’un scénario `tutorial.lessons.<id>.<étape>`).
progress: 'Leçon {current} sur {total}'
nav:
    skip_lesson: Passer cette leçon
    finish: Terminer
lesson:
    try_again: Ce n’est pas le bon coup, essayez encore.
    start_over: Par là, impossible de revenir en arrière. Recommençons.
    done: Bravo !
    invalid: Les leçons n’ont pas pu être chargées.
lessons:
    chess-new:
        title: Tout ce que vous savez, sauf…
        text: 'Le fou, la tour, le cavalier et le roi se déplacent comme aux échecs. Trois pièces sont nouvelles : la baliste, qui n’avance que tout droit ; le paladin, d’une ou deux cases en ligne droite ; et le garde, d’une ou deux cases en diagonale. Le soldat n’est pas un pion : il avance d’une case en diagonale.'
    chess-stack:
        title: L’empilement change tout
        text: Une pièce peut se déplacer sur une pièce amie. Les deux forment alors une pile qui se déplace avec les mouvements des deux. Ne déplacer que la pièce du dessus sépare à nouveau la pile.
    goal:
        title: Le but
        text: 'Deux armées s’affrontent. Capturez le roi adverse et vous gagnez : la partie s’arrête dès qu’un roi est pris.'
    soldier:
        title: Le soldat
        text: Le soldat avance d’une case en diagonale. Conduisez-le sur chaque case jaune, l’une après l’autre.
    knight:
        title: Le cavalier
        text: Le cavalier saute en L et peut franchir les autres pièces. Atteignez chaque case jaune, l’une après l’autre.
    bishop:
        title: Le fou
        text: Le fou glisse sur une diagonale, sur n’importe quelle distance. Atteignez chaque case jaune, l’une après l’autre.
    rook:
        title: La tour
        text: La tour glisse en ligne droite, sur n’importe quelle distance. Atteignez chaque case jaune, l’une après l’autre.
    paladin:
        title: Le paladin
        text: Le paladin avance d’une ou deux cases en ligne droite. Atteignez chaque case jaune, l’une après l’autre.
    guard:
        title: Le garde
        text: Le garde avance d’une ou deux cases en diagonale. Atteignez chaque case jaune, l’une après l’autre.
    ballista:
        title: La baliste
        text: La baliste n’avance que tout droit, aussi loin qu’elle veut, et ne recule jamais. Atteignez chaque case jaune, l’une après l’autre.
    king:
        title: Le roi
        text: Le roi avance d’une case dans toutes les directions. Perdez le vôtre et la partie est finie. Atteignez chaque case jaune, l’une après l’autre.
    capture:
        title: Capturer
        text: Une pièce capture en se déplaçant sur une pièce adverse. Prenez les deux soldats marqués avec votre tour.
    stack:
        title: Empiler
        stack_onto: 'Déplacez votre cavalier sur votre propre soldat et choisissez d’empiler : ils se déplacent désormais ensemble.'
        reply: Votre adversaire joue.
        unstack: 'Déplacez maintenant seulement la pièce du dessus pour capturer le soldat noir. Choisissez de ne bouger que cette pièce : le soldat reste en place.'
    fork:
        title: Une tactique
        carry: Elle peut ainsi transporter une pièce lente à l’autre bout du plateau
        unstack_fork: Puis vous pouvez désempiler la pièce du dessus pour porter une attaque dévastatrice
        legal_blunder: Mettre son propre roi en échec, ou le laisser sans défense, est un coup légal
        capture_king: Capturez le roi pour gagner la partie.
