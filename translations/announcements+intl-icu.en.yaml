# Player-facing announcements (src/Service/Announcement/AnnouncementProvider.php).
# One block per id listed in AnnouncementProvider::ENTRIES: title + body.
items:
    onboarding_coach:
        title: A new home, a tutorial and a coach
        body: 'The home page now puts the next step first: resume your game, play the next bot, or play online. New to Keres? Answer “Do you play chess?” for a short tutorial made for you, and switch on the coach in a bot game for hints, warnings when a piece can be captured, and a chance to take a move back. To unlock the next bot you must now win without help: no move taken back and no hint. Guests play bot level 1; create an account to keep your progress and face level 2. You can also have one bot game at a time.'
    rated_bot_games:
        title: Rated games against the bots
        body: 'In Play against the AI, tick “Rated game” to play a clocked game against the bot of your level: it moves your rating, and the bot’s.'
    beat_the_bots:
        title: Beat the next bot
        body: 'The lobby now proposes the next bot to beat, one click away: win without taking a move back to unlock the following level. Your progress as a guest follows you when you create an account.'
    eval_graph:
        title: See where a game turned
        body: 'Once the engine has evaluated a game, a graph under the board shows the verdict move after move, and each move in the list shows what it cost: clicking the graph jumps to that position.'
    lobby_new_game:
        title: A tidier lobby
        body: 'The seek form now opens from a “New game” button, and playing hot-seat has its own card at the bottom of the page.'
    correspondence_seeks:
        title: Correspondence seeks stay open for a week
        body: 'A correspondence seek now stays in the lobby for seven days, even when you close the page, so an opponent can pick it up whenever they come by.'
    finished_game_review:
        title: The evaluation bar follows you through a finished game
        body: 'When you step back through the moves of a finished game, the evaluation bar now stays on screen and shows the engine’s verdict for each position.'
    black_pieces_outline:
        title: A light outline on the black pieces
        body: 'Black pieces are now drawn exactly like the white ones with the colours swapped, including their outline, which makes them easier to read on the dark squares.'
    game_over_modal:
        title: Rematch from the end-of-game screen
        body: 'A window now appears when a game ends, with a quick rematch on the opposite colours (against a player, they get a notification and accept it), a new game, and feedback. Click the greyed-out board to bring it back.'
    piece_animation:
        title: Pieces now glide to their square
        body: 'Pieces now slide to their destination when a move is played. Pick Instant, Fast or Slow in the board options, and save your choice as your default in Settings → Board & gameplay.'
    board_arrows:
        title: Draw arrows on the board
        body: 'On desktop, hold the right mouse button and drag from one square to another to draw an arrow: orange by default, green with Shift, red with Ctrl. It works on any position, including past moves in the history, and arrows clear when a move is played.'
    french_translation:
        title: Keres now speaks French
        body: 'The whole site, the messages on the board and the e-mails are available in French. Switch language from the menu or in Settings → Profile; “Automatic” follows your browser.'
    fullscreen_layout:
        title: Fullscreen that fits your screen
        body: 'The fullscreen button takes over the whole page, and the opponent’s row, the board and your own row now always fit the screen at any shape. Everything else is a scroll away.'
    rotate_opponent_pieces:
        title: Face your opponent’s pieces
        body: 'A new button on the game page turns the opponent’s pieces upside down, as on a real board. It is off by default.'
    guest_limits:
        title: 'Guest games: AI levels 1 to 4'
        body: 'Playing without an account is limited to AI levels 1 to 4 and has no live evaluation bar. Sign in to unlock levels 5 to 10 and the evaluation bar.'
    persistent_login:
        title: Stay signed in across updates
        body: 'New versions of Keres no longer log you out. You stay signed in for 30 days after your last visit.'
    mobile_menu:
        title: A proper menu on mobile
        body: 'On phones the navigation hides behind a burger button, and every menu entry now has an icon next to its label.'
    game_over_reason:
        title: Why did the game end?
        body: 'The game-over banner now says exactly how it ended (king captured, 40-move rule, insufficient material, resignation, timeout…) instead of always “checkmate”.'
    game_players_options:
        title: Players and options at a glance
        body: 'The game page shows who is playing above the board, with badges for the options (rated or casual, time control, live evaluation). Every card in your games lists shows them too.'
    result_banner:
        title: Win, loss or draw, in one glance
        body: 'The game-over banner is now green when you win, red when you lose and orange for a draw, with readable text on each.'
    stack_or_select:
        title: Smarter stacking
        body: 'Clicking a friendly piece asks whether you want to stack onto it or select it, and only when both are really possible. Otherwise the game just does the obvious thing.'
    live_evaluation:
        title: Live evaluation bar
        body: 'Tick “Live evaluation” when you start a casual game to see a bar next to the board telling who is ahead, updated after every move. The new-game form is also tidier, with a random side by default.'
    new_look:
        title: A fresh look
        body: 'New logo, redrawn piece icons, a new board colour theme and better contrast on tags and the lobby buttons.'
    hidden_games_feed:
        title: Hidden games stay hidden
        body: 'A game you remove from your lists no longer shows in the public “recently finished games” feed, which no longer names the players either.'
    email_notifications:
        title: E-mail notifications on by default
        body: 'Every kind of e-mail notification (your turn, results, friend requests, matched games) is now on unless you switch it off in Settings.'
    v1:
        title: Keres v1.0 is here
        body: 'Correspondence games, invites, and AI opponents at every level are now live.'
list:
    title: Announcements
    show_more: 'Show {count, plural, one {# more announcement} other {# more announcements}}'
    show_less: Show fewer
