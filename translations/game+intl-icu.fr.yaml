        title: Cette invitation n’est plus disponible
        text: Elle a peut-être expiré ou a déjà été acceptée. Demandez un nouveau lien.
    not_found:
        title: Invitation introuvable
        text: Ce lien d’invitation n’est pas valide.

# Legacy `{error: ...}` JSON of the /play/{uuid}/* actions, shown as-is by the TypeScript client.
api_error:
    game_not_found: Partie introuvable.
    access_denied: Accès refusé.
    game_finished: Cette partie est déjà terminée.
    flagged: Votre temps est écoulé.
    not_your_turn: Ce n’est pas votre tour.
    concurrent_move: Un autre coup était joué en même temps. Veuillez réessayer.
    invalid_move_data: Le coup n’a pas pu être lu.
    abort_not_allowed: Cette partie ne peut plus être annulée.
    clock_not_expired: Le temps n’est pas encore écoulé.
    no_moves_to_undo: Aucun coup à annuler.
    undo_unavailable_multiplayer: L’annulation d’un coup n’est pas disponible dans les parties multijoueur.
