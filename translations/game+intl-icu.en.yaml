        title: Too many attempts
        text: Please wait a moment and reload this page to try again.
    expired:
        title: This invite is no longer available
        text: It may have expired or already been accepted. Ask for a fresh link.
    not_found:
        title: Invite not found
        text: This invite link is invalid.

# Legacy `{error: ...}` JSON of the /play/{uuid}/* actions, shown as-is by the TypeScript client.
api_error:
    game_not_found: Game not found.
    access_denied: Access denied.
    game_finished: This game is already over.
    flagged: Your time has run out.
    not_your_turn: It’s not your turn.
    concurrent_move: Another move was being played at the same time. Please try again.
    invalid_move_data: The move could not be read.
    abort_not_allowed: This game can no longer be aborted.
    clock_not_expired: The clock has not run out yet.
    no_moves_to_undo: There are no moves to undo.
    undo_unavailable_multiplayer: Undo is not available in multiplayer games.
