name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if Dockerfile.base changed
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^Dockerfile.base$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push php-base image
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ghcr.io/vincentchalnot/keres-platform/php-base:latest
            ghcr.io/vincentchalnot/keres-platform/php-base:${{ github.sha }}
          cache-from: type=gha,scope=php-base
          cache-to: type=gha,scope=php-base,mode=max

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: composer install
        # --no-scripts: the post-install-cmd (cache:clear) needs a live
        # DATABASE_URL/APP_SECRET/etc., which this job never has — cs:check
        # is a static analysis tool, it only needs the autoloader.
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: composer cs:check
        run: composer cs:check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run type-check
        run: npm run type-check

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: build-base
    # Run whether build-base was skipped (no Dockerfile.base changes) or succeeded
    if: always() && needs.build-base.result != 'failure'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_prod
          push: false
          load: true
          tags: ghcr.io/vincentchalnot/keres-platform/php:${{ github.sha }}
          cache-from: type=gha,scope=php-platform
          cache-to: type=gha,scope=php-platform,mode=max

      - name: Build php-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_worker_prod
          push: false
          load: true
          tags: ghcr.io/vincentchalnot/keres-platform/php-worker:${{ github.sha }}
          cache-from: type=gha,scope=php-platform

  push:
    name: Push Images
    runs-on: ubuntu-latest
    # Only push on commits to main, not on pull requests.
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.lint.result == 'success'
    needs: [build, lint]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_prod
          push: true
          tags: |
            ghcr.io/vincentchalnot/keres-platform/php:latest
            ghcr.io/vincentchalnot/keres-platform/php:${{ github.sha }}
          cache-from: type=gha,scope=php-platform

      - name: Push php-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_worker_prod
          push: true
          tags: |
            ghcr.io/vincentchalnot/keres-platform/php-worker:latest
            ghcr.io/vincentchalnot/keres-platform/php-worker:${{ github.sha }}
          cache-from: type=gha,scope=php-platform
