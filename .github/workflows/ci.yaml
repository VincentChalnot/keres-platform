name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if Dockerfile.base changed
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^Dockerfile.base$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push php-base image
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ghcr.io/vincentchalnot/keres-platform/php-base:latest
            ghcr.io/vincentchalnot/keres-platform/php-base:${{ github.sha }}
          cache-from: type=gha,scope=php-base
          cache-to: type=gha,scope=php-base,mode=max

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: composer install
        # --no-scripts: the post-install-cmd (cache:clear) needs a live
        # DATABASE_URL/APP_SECRET/etc., which this job never has — cs:check
        # is a static analysis tool, it only needs the autoloader.
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: composer cs:check
        run: composer cs:check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run type-check
        run: npm run type-check

      - name: npm run check:front
        # Bulma/unknown state classes, grid without grid-cols-*, Font Awesome styles not imported
        run: npm run check:front

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    # The functional tests need the real PostgreSQL schema (FOR UPDATE SKIP LOCKED, make_interval...).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET: '$ecretf0rt3st'
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
      # Refused at once: GameUpdatePublisher swallows publish failures.
      MERCURE_URL: http://127.0.0.1:9/.well-known/mercure
      MERCURE_PUBLIC_URL: https://localhost/.well-known/mercure
      MERCURE_JWT_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      MERCURE_PUBLISHER_JWT_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      MERCURE_SUBSCRIBER_JWT_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      BACKEND_API_URL: http://127.0.0.1:9
      AI_BACKEND_API_URL: http://127.0.0.1:9
      MAILER_DSN: 'null://null'
      MAILER_FROM_ADDRESS: noreply@example.com
      STATIC_SITE_URL: https://example.com
      SERVER_NAME: localhost
      DEFAULT_URI: https://localhost
      SESSION_COOKIE_DOMAIN: localhost
      SESSION_COOKIE_NAME: KERESTESTSESSID
      MESSENGER_TRANSPORT_DSN: 'in-memory://'
      CORS_ALLOW_ORIGIN: '^https://localhost$'
      ADMIN_NOTIFICATION_EMAIL: ''
      OIDC_GOOGLE_CLIENT_ID: ''
      OIDC_GOOGLE_CLIENT_SECRET: ''
      OIDC_FACEBOOK_CLIENT_ID: ''
      OIDC_FACEBOOK_CLIENT_SECRET: ''
      OIDC_DISCORD_CLIENT_ID: ''
      OIDC_DISCORD_CLIENT_SECRET: ''
      TRUSTED_PROXIES: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: apcu, intl, zip, sodium, pdo_pgsql
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Create and migrate the test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test -n

      - name: PHPUnit
        run: vendor/bin/phpunit

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: build-base
    # Run whether build-base was skipped (no Dockerfile.base changes) or succeeded
    if: always() && needs.build-base.result != 'failure'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute app version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_prod
          push: false
          load: true
          tags: ghcr.io/vincentchalnot/keres-platform/php:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=php-platform
          cache-to: type=gha,scope=php-platform,mode=max

      - name: Build php-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_worker_prod
          push: false
          load: true
          tags: ghcr.io/vincentchalnot/keres-platform/php-worker:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=php-platform

  push:
    name: Push Images
    runs-on: ubuntu-latest
    # Only push on commits to main, not on pull requests.
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.lint.result == 'success' && needs.tests.result == 'success'
    needs: [build, lint, tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute app version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_prod
          push: true
          tags: |
            ghcr.io/vincentchalnot/keres-platform/php:latest
            ghcr.io/vincentchalnot/keres-platform/php:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=php-platform

      - name: Push php-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_worker_prod
          push: true
          tags: |
            ghcr.io/vincentchalnot/keres-platform/php-worker:latest
            ghcr.io/vincentchalnot/keres-platform/php-worker:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=php-platform
